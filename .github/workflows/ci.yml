# Сборка и тесты на каждый push (docs/PROMPT.md §3 «Сборка и упаковка»).
# Контейнер fedora:43 — нижняя граница: GTK 4.20 и libadwaita 1.8. Что соберётся здесь,
# то соберётся и на свежих системах; наоборот — не обязательно.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:43
    steps:
      - name: Зависимости
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc rust cargo rustfmt clippy
          gtk4-devel libadwaita-devel glib2-devel
          gstreamer1-devel gstreamer1-plugins-base-devel
          desktop-file-utils appstream
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fedora43-${{ hashFiles('Cargo.lock') }}
          restore-keys: fedora43-
      - name: Форматирование
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Тесты
        run: cargo test --workspace
      - name: Релизная сборка
        run: cargo build --release
      - name: .desktop и metainfo
        run: |
          desktop-file-validate packaging/app.melogold.Melogold.desktop
          appstreamcli validate --no-net packaging/app.melogold.Melogold.metainfo.xml

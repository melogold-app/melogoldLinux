[workspace]
resolver = "2"
members = [
    "crates/melogold-core",
    "crates/melogold-gtk",
]

[workspace.package]
# Версия — только здесь (docs/PROMPT.md §3 «Обновления»), без суффиксов.
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/melogold-app/melogoldLinux"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
percent-encoding = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
async-channel = "2"
# gtk4 и libadwaita — пара одного выпуска gtk-rs: обе завязаны на один glib.
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }

[profile.release]
lto = "thin"
codegen-units = 4
